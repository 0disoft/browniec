name: Windows quick start

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-quickstart.yml'
      - '.gitattributes'
      - 'README.md'
      - 'examples/answer.brc'
      - 'examples/array-read.brc'
      - 'examples/branches.brc'
      - 'examples/mutable-slices.brc'
      - 'examples/shipping-fee.brc'
      - 'examples/projects/hello/**'
      - 'examples/projects/configured-output/**'
      - 'fairy.lock'
      - 'fairy.toml'
      - 'fairy.windows.json'
      - 'native/windows-runtime-engine.c'
      - 'native/runtime-engine/bridge.inc'
      - 'native/runtime-engine/clock.inc'
      - 'native/abi_thread_identity.c'
      - 'native/abi_thread_identity.h'
      - 'native/host_adapter_process.c'
      - 'native/host_adapter_process.h'
      - 'native/windows-host-adapter-process.c'
      - 'native/windows-project-cli.c'
      - 'native/windows-project-input-reader.c'
      - 'native/runtime_input_reader.c'
      - 'native/runtime_input_reader.h'
      - 'native/anchored_sources.c'
      - 'native/anchored_sources.h'
      - 'native/anchored-source-loader/**'
      - 'src/**'
      - 'tests/m2/cli_locations.fy'
      - 'toolchain.json'
      - 'docs-site/cli-output.json'
      - 'docs-site/src/content/docs/**/cli/commands-and-errors.md'
      - 'tools/sync-cli-output.py'
      - 'tools/check-cli-contract.py'
      - 'tools/check-cli-examples.py'
      - 'tools/check-verifier-locations.py'
      - 'tools/runtime-engine/adapter-fixture.c'
      - 'tools/setup-toolchain.py'
      - 'tools/fairyc-windows-release.patch'

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Windows checks for this push
        id: changes
        shell: pwsh
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          $scope = 'full'
          $examples = @('examples/branches.brc', 'examples/array-read.brc', 'examples/mutable-slices.brc')
          $selected = $examples
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:PUSH_BEFORE -cmatch '^[0-9a-f]{40}$' -and
              $env:PUSH_BEFORE -ne ('0' * 40)) {
            $PSNativeCommandUseErrorActionPreference = $false
            $changed = @(git diff --no-renames --name-only $env:PUSH_BEFORE HEAD -- 2>$null)
            if ($LASTEXITCODE -eq 0 -and $changed.Count -gt 0) {
              if ($changed.Count -eq 1 -and $changed[0] -ceq 'tests/m2/cli_locations.fy') {
                $scope = 'verifier-only'
                $selected = @()
              } elseif (@($changed | Where-Object { $_ -cnotin $examples }).Count -eq 0) {
                $scope = 'examples-only'
                $selected = $changed
              }
            }
          }
          "examples=$($selected -join ',')" >> $env:GITHUB_OUTPUT
          Write-Output "Windows check scope: $scope"
          "scope=$scope" >> $env:GITHUB_OUTPUT

      - name: Check clean checkout and read the toolchain pin
        id: toolchain
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0 -or $status -or (Test-Path build) -or (Test-Path ../fairyc)) {
            throw 'Expected a clean checkout without build output or an adjacent Fairy C checkout.'
          }
          $go = (Get-Content toolchain.json -Raw | ConvertFrom-Json).bootstrap.goVersion
          if ($go -cnotmatch '^go[0-9]+[.][0-9]+[.][0-9]+$') { throw "Invalid Go pin: $go" }
          "go-version=$($go.Substring(2))" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          architecture: x64

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.toolchain.outputs.go-version }}
          cache: false

      - name: Install the pinned Fairy C toolchain
        run: python -B tools/setup-toolchain.py

      - name: Build the locked Windows release
        if: steps.changes.outputs.scope != 'verifier-only'
        run: ./build/toolchain/fairyc.exe build --release --locked

      - name: Check the answer example
        if: steps.changes.outputs.scope == 'full'
        run: ./build/browniec.exe check examples/answer.brc --json

      - name: Run the answer example and verify its output
        if: steps.changes.outputs.scope == 'full'
        shell: pwsh
        run: |
          $stderr = Join-Path $env:RUNNER_TEMP 'browniec-answer.stderr'
          $stdout = @(./build/browniec.exe run examples/answer.brc --json 2> $stderr)
          $exitCode = $LASTEXITCODE
          $stdout | Write-Output
          if ($exitCode -ne 0 -or (Get-Item $stderr).Length -ne 0) {
            Get-Content $stderr
            throw "Expected exit 0 and empty stderr; got exit $exitCode."
          }
          if ($stdout.Count -ne 1) { throw 'Expected one JSON line.' }
          $result = ConvertFrom-Json -InputObject $stdout[0] -NoEnumerate
          if ($result -isnot [pscustomobject] -or $result.schema -cne 'browniec.result/v1' -or
              $result.command -cne 'run' -or $result.status -cne 'completed' -or
              $result.return_i32 -isnot [long] -or $result.return_i32 -ne 77 -or $null -ne $result.error) {
            throw 'Expected a completed run with return_i32: 77 and no error.'
          }

      - name: Check CLI contracts and the process adapter on the same release binary
        if: steps.changes.outputs.scope == 'full'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Expected an installed MSVC x64 toolchain.' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'

          Push-Location build
          try {
            cl.exe /nologo /std:c11 /TC /MT /W4 /WX /O2 ../tools/runtime-engine/adapter-fixture.c /Fe:adapter-fixture.exe
            if ($LASTEXITCODE -ne 0) { throw "Adapter fixture build exited with code $LASTEXITCODE." }
          } finally {
            Pop-Location
          }
          python -B tools/check-cli-contract.py --exe ./build/browniec.exe --adapter-exe ./build/adapter-fixture.exe

      - name: Run selected branch and array examples on the same release binary
        if: steps.changes.outputs.examples != ''
        shell: pwsh
        env:
          EXAMPLES: ${{ steps.changes.outputs.examples }}
        run: python -B tools/check-cli-examples.py --exe ./build/browniec.exe ($env:EXAMPLES -split ',')

      - name: Check internal verifier diagnostic output
        if: steps.changes.outputs.scope != 'examples-only'
        run: python -B tools/check-verifier-locations.py
